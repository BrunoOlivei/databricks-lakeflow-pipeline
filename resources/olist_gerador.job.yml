resources:
  jobs:
    olist_gerador:
      name: OLIST_GERADOR
      tasks:
        - task_key: olist_gerador
          disabled: false
          email_notifications: {}
          notebook_task:
            base_parameters:
              catalog: ${var.catalog}
              dias_por_execucao: "1"
              injetar: nenhum
            notebook_path: ../01_gerador_olist.py
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
      email_notifications:
        no_alert_for_skipped_runs: false
      max_concurrent_runs: 1
      performance_target: PERFORMANCE_OPTIMIZED
      queue:
        enabled: true
      timeout_seconds: 0
      webhook_notifications: {}
