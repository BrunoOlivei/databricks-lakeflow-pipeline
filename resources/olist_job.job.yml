resources:
  jobs:
    olist_job:
      name: OLIST_JOB
      tasks:
        - task_key: pipeline_olist
          disabled: false
          email_notifications: {}
          notification_settings:
            alert_on_last_attempt: false
            no_alert_for_canceled_runs: false
            no_alert_for_skipped_runs: false
          pipeline_task:
            pipeline_id: ${resources.pipelines.pipeline_olist.id}
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: checagem_gold
          depends_on:
            - task_key: pipeline_olist
          disabled: false
          email_notifications: {}
          notebook_task:
            base_parameters:
              catalog: ${var.catalog}
            notebook_path: ../02_checagem_gold.py
            source: WORKSPACE
          notification_settings:
            alert_on_last_attempt: false
            no_alert_for_canceled_runs: false
            no_alert_for_skipped_runs: false
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: alerta_falha
          depends_on:
            - task_key: pipeline_olist
            - task_key: checagem_gold
          disabled: false
          email_notifications: {}
          notebook_task:
            base_parameters:
              mensagem: Falha no job {{job.name}}, execução {{job.run_id}}
            notebook_path: ../03_alerta.py
            source: WORKSPACE
          run_if: AT_LEAST_ONE_FAILED
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: tem_pedidos
          depends_on:
            - task_key: checagem_gold
          condition_task:
            left: '{{tasks.checagem_gold.values.pedidos_ultimo_dia}}'
            op: GREATER_THAN
            right: "0"
          disabled: false
          email_notifications: {}
          notification_settings:
            alert_on_last_attempt: false
            no_alert_for_canceled_runs: false
            no_alert_for_skipped_runs: false
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: alerta_sem_pedidos
          depends_on:
            - outcome: "false"
              task_key: tem_pedidos
          disabled: false
          email_notifications: {}
          notebook_task:
            base_parameters:
              mensagem: '{{tasks.checagem_gold.values.ultima_data}}'
            notebook_path: ../03_alerta.py
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
      email_notifications:
        no_alert_for_skipped_runs: false
        on_failure:
          - ${var.email_alerta}
      max_concurrent_runs: 1
      notification_settings:
        no_alert_for_canceled_runs: false
        no_alert_for_skipped_runs: false
      performance_target: STANDARD
      queue:
        enabled: true
      timeout_seconds: 0
      trigger:
        file_arrival:
          min_time_between_triggers_seconds: 0
          url: /Volumes/${var.catalog}/olist_raw/landing/order_events/
          wait_after_last_change_seconds: 60
      webhook_notifications: {}
